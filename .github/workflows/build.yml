name: Build

# Builds only the NanoKVM versions being worked on: those whose patches/<version>/
# changed in this push/PR; if none changed (shared files only) - the latest version.
# Already released versions are not rebuilt.

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - patches/**
      - files/**
      - scripts/**
      - install.sh
      - uninstall.sh
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -s sh install.sh uninstall.sh files/tailscale-wrapper.sh
      - run: shellcheck scripts/build.sh

  versions:
    name: Select NanoKVM versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          latest=$(find patches -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          changed=""
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD -- patches | cut -d/ -f2 | sort -u)
          fi
          versions=""
          for v in $changed; do
            [ -d "patches/$v" ] && versions="$versions $v"
          done
          [ -n "$versions" ] || versions=$latest
          echo "building:$versions"
          echo "versions=$(echo "$versions" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    name: Build NanoKVM ${{ matrix.version }}
    needs: [lint, versions]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune -af

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install --global pnpm@11

      - name: Build
        run: ./scripts/build.sh "${{ matrix.version }}-0"

      - uses: actions/upload-artifact@v7
        with:
          name: nanokvm-tailscale-login-server_${{ matrix.version }}-dev
          path: dist/*
          retention-days: 7
